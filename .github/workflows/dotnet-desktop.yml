name: Build Desktop App

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'  # Specify your required .NET version

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish (Optional)
        run: dotnet publish --configuration Release --no-build

      - name: Upload artifact (Optional)
        uses: actions/upload-artifact@v3
        with:
          name: desktop-app
          path: bin/Release/net6.0-windows/publish/  # Adjust path to your publish output

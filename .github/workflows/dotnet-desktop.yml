name: Build Desktop App

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'  # Specify your required .NET version

      - name: Cache NuGet packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Restore dependencies
        run: dotnet restore "source/CS 4000 Compiler.sln"

      - name: Build
        run: dotnet build --configuration Release --no-restore "source/CS 4000 Compiler.sln"

      - name: Publish (Optional)
        run: dotnet publish --configuration Release --no-build "source/CS 4000 Compiler.sln"

      - name: Upload artifact (Optional)
        uses: actions/upload-artifact@v4
        with:
          name: desktop-app
          path: bin/Release/net6.0-windows/publish/  # Adjust path to your publish output
